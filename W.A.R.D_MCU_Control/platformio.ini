[env:adafruit_feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
; Use the Earle Philhower core for better hardware control
board_build.core = earlephilhower
monitor_speed = 115200
extra_scripts = pre:extra_scripts/os_platform_packages.py


; platform_packages =
;   	platformio/toolchain-gccarmnoneeabi @ 1.140201.0

lib_deps = adafruit/Adafruit MCP2515@^0.2.1
              adafruit/Adafruit BusIO
